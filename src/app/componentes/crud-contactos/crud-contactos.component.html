<div class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h5 class="modal-title">{{ titulo }}</h5>
        </div>
        <div class="modal-body">
            <form [formGroup]="formularioContacto" (ngSubmit)="guardar()" autocomplete="off">
                <div class="form-group">
                    <label for="asunto">* Asunto:</label>
                    <input type="text" class="form-control" id="asunto" formControlName="asunto" required>
                    <div *ngIf="formularioContacto.get('asunto')?.invalid && (formularioContacto.get('asunto')?.dirty || formularioContacto.get('asunto')?.touched)">
                        <div *ngIf="formularioContacto.get('asunto')?.hasError('required')"><p>El asunto es obligatorio.</p></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="mensaje">* Mensaje:</label>
                    <textarea class="form-control" id="mensaje" formControlName="mensaje" rows="5" required></textarea>
                    <div *ngIf="formularioContacto.get('mensaje')?.invalid && (formularioContacto.get('mensaje')?.dirty || formularioContacto.get('mensaje')?.touched)">
                        <div *ngIf="formularioContacto.get('mensaje')?.hasError('required')"><p>El mensaje es obligatorio.</p></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="adjunto">Adjunto:</label>
                    <input type="file" class="form-control" id="adjunto" formControlName="adjunto">
                </div>
                <div class="form-group">
                    <label for="idUsuario">* ID de Usuario:</label>
                    <input type="number" class="form-control" id="idUsuario" formControlName="idUsuario" required>
                    <div *ngIf="formularioContacto.get('idUsuario')?.invalid && (formularioContacto.get('idUsuario')?.dirty || formularioContacto.get('idUsuario')?.touched)">
                        <div *ngIf="formularioContacto.get('idUsuario')?.hasError('required')"><p>El ID de usuario es obligatorio.</p></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancelar" routerLink="/dashboard-contactos">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
                <div *ngIf="formularioContacto.invalid && enviado">
                    <p>Por favor, ingrese correctamente todos los campos antes de guardar.</p>
                </div>
            </form>
        </div>
    </div>
</div>
