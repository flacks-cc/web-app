<div class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h5 class="modal-title">{{ titulo }}</h5>
        </div>
        <div class="modal-body">
            <form [formGroup]="formularioDetalle" (ngSubmit)="guardar()" autocomplete="off">
                <div class="form-group">
                    <label for="cantidad">* Cantidad:</label>
                    <input type="number" class="form-control" id="cantidad" formControlName="cantidad" required>
                    <div *ngIf="formularioDetalle.get('cantidad')?.invalid && (formularioDetalle.get('cantidad')?.dirty || formularioDetalle.get('cantidad')?.touched)">
                        <div *ngIf="formularioDetalle.get('cantidad')?.hasError('required')"><p>La cantidad es obligatoria.</p></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="idUsuario">* ID de Usuario:</label>
                    <input type="number" class="form-control" id="idUsuario" formControlName="idUsuario" required>
                </div>
                <div class="form-group">
                    <label for="idProducto">* ID de Producto:</label>
                    <input type="number" class="form-control" id="idProducto" formControlName="idProducto" required>
                </div>
                <div class="form-group">
                    <label for="idReservacion">* ID de Reservación:</label>
                    <input type="number" class="form-control" id="idReservacion" formControlName="idReservacion" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancelar" routerLink="/dashboard-detalles">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
                <div *ngIf="formularioDetalle.invalid && enviado">
                    <p>Por favor, ingrese correctamente todos los campos antes de guardar.</p>
                </div>
            </form>
        </div>
    </div>
</div>
