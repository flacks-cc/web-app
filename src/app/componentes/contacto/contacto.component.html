<section id="titulo">
    <h3>Contáctanos</h3>
</section>
<section id="contacto">
    <div>
        <form action="#" autocomplete="off">
            <label for="nombre">* Nombre completo:</label>
            <div class="nombre-apellido">
                <input type="text" id="nombre" name="nombre" placeholder="Nombre" class="campo" required>
                <input type="text" id="apellido" name="apellido" placeholder="Apellidos" class="campo" required>
            </div>

            <label for="email">* Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" class="campo-email"
                required>
                <p>Ingresa un correo electrónico válido</p>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" placeholder="Ingresa tu mensaje" required></textarea>

            <input type="submit" name="enviar" value="Enviar" class="btnEnviar">
        </form>
    </div>
</section>
