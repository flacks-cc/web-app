<div class="main-container" id="main">
    <!-- Llamamos al componente del menú lateral -->
    <app-menu-lateral></app-menu-lateral>

    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <div class="container-dash">
                    <!-- Sección del dashboard para administrar categorías -->
                    <div>
                        <div class="title-container">
                            <h2>Administrar categorías</h2>
                            <button routerLink="/crud-categorias">Agregar categoría</button>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID de Categoría</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <!-- Acciones CRUD -->
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Filas de la tabla con las categorías -->
                                <tr *ngFor="let c of categorias; let i = index">
                                    <td>{{ c?.id }}</td>
                                    <td>{{ c?.nombre }}</td>
                                    <td>{{ c?.descripcion }}</td>
                                    <td>
                                        <i class="far fa-edit fa-lg text-info me-3" [routerLink]="['/editar-categoria/', c.id]" (click)="mostrarId(c.id)"></i>
                                        <i (click)="abrirEliminarPopup(i)" class="far fa-trash-alt fa-lg text-danger"></i>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Popup para eliminar registros -->
                    <div class="modal-overlay eliminar" *ngIf="popupEliminarVisible">
                        <div class="modal">
                            <div class="modal-header">
                                <h5 class="modal-title">Confirmar eliminación</h5>
                            </div>
                            <div class="modal-body">
                                <div class="msj-eliminar">
                                    <p>¿Estás seguro de que deseas eliminar esta categoría?</p>
                                </div>
                                <div class="modal-footer">
                                    <button class="btn-cancelar" (click)="cerrarEliminarPopup()">Cancelar</button>
                                    <button class="btn-eliminar" (click)="eliminar(categorias[indiceCategoriaAEliminar])">Eliminar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
