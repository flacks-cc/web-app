<div class="main-container" id="main">

    <!-- Llamamos al component menu lateral para que aparezca nuestra sidebar -->
    <app-menu-lateral></app-menu-lateral>

    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <div class="container-dash">

                    <!-- Sección del dashboard para administrar servicios -->
                    <div>
                        <div class="title-container">
                            <h2>Administrar servicios</h2>
                            <button routerLink="/crud-servicios">Agregar servicio</button>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th hidden>Id</th>
                                    <th>Nombre del servicio</th>
                                    <th>Descripción</th>
                                    <th>Duración</th>
                                    <th>Precio</th>
                                    <th></th> <!-- Acciones CRUD -->
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Filas de la tabla con los servicios -->
                                <tr *ngFor="let s of servicios; let i = index">
                                    <td hidden>{{ s.idServicio }}</td>
                                    <td>{{ s.nombreServicio }}</td>
                                    <td>{{ s.descripcion }}</td>
                                    <td>{{ s.duracion }} minutos</td>
                                    <td>${{ s.precio }} MXN</td>
                                    <td>
                                        <i class="far fa-edit fa-lg text-info me-3" [routerLink]="['/editar-servicio/', s.idServicio]"></i>
                                        <i (click)="abrirEliminarPopup(i)" class="far fa-trash-alt fa-lg text-danger"></i>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Popup para eliminar registros -->
                    <div class="modal-overlay eliminar" *ngIf="popupEliminarVisible">
                        <div class="modal">
                            <div class="modal-header">
                                <h5 class="modal-title">Confirmar eliminación</h5>
                            </div>
                            <div class="modal-body">
                                <div class="msj-eliminar">
                                    <p>¿Estás seguro de que deseas eliminar este registro?</p>
                                </div>
                                <div class="modal-footer">
                                    <button class="btn-cancelar" (click)="cerrarEliminarPopup()">Cancelar</button>
                                    <button class="btn-eliminar" (click)="eliminar(servicios[indiceServicioAEliminar])">Eliminar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
