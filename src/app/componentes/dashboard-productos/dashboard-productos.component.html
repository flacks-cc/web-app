<div class="main-container" id="main">

    <!-- Llamamos al component menu lateral para que aparezca nuestra sidebar -->
    <app-menu-lateral></app-menu-lateral>

    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <div class="container-dash">

                    <!-- Sección del dashboard para administrar productos -->
                    <div>
                        <div class="title-container">
                            <h2>Administrar productos</h2>
                            <button routerLink="/crud-productos">Agregar producto</button>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th hidden>Id</th>
                                    <th>Nombre del producto</th>
                                    <th>Descripción</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th></th> <!-- Acciones CRUD -->
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Filas de la tabla con los productos -->
                                <tr *ngFor="let p of productos; let i = index">
                                    <td hidden>{{ p.idProducto }}</td>
                                    <td>{{ p.nombreProducto }}</td>
                                    <td>{{ p.descripcion }}</td>
                                    <td>${{ p.precio }} MXN</td>
                                    <td>{{ p.stock }} unidades</td>
                                    <!-- Iconos de Font Awesome para editar y eliminar -->
                                    <td>
                                        <i class="far fa-edit fa-lg text-info me-3" [routerLink]="['/editar-producto/', p.idProducto]"></i>
                                        <i (click)="abrirEliminarPopup(i)" class="far fa-trash-alt fa-lg text-danger"></i>
                                    </td>   
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Popup para eliminar registros -->
                    <div class="modal-overlay eliminar" *ngIf="popupEliminarVisible">
                        <div class="modal">
                            <div class="modal-header">
                                <h5 class="modal-title">Confirmar eliminación</h5>
                            </div>
                            <div class="modal-body">
                                <div class="msj-eliminar">
                                    <p>¿Estás seguro de que deseas eliminar este registro?</p>
                                </div>
                                <div class="modal-footer">
                                    <button class="btn-cancelar" (click)="cerrarEliminarPopup()">Cancelar</button>
                                    <button class="btn-eliminar" (click)="eliminar(productos[indiceProductoAEliminar])">Eliminar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
