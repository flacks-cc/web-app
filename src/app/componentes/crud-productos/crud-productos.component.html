<div class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h5 class="modal-title">{{ titulo }}</h5>
      </div>
      <div class="modal-body">
        <form [formGroup]="formularioProducto" (ngSubmit)="guardar()" autocomplete="off">
          <!-- Campos del formulario -->
          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" class="form-control" id="nombre" formControlName="nombre" required>
            <!-- Mensajes de validación -->
          </div>
          <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <input type="text" class="form-control" id="descripcion" formControlName="descripcion">
            <!-- Mensajes de validación -->
          </div>
          <div class="form-group">
            <label for="cantidadTotal">Total de productos:</label>
            <input type="text" class="form-control" id="cantidadTotal" formControlName="cantidadTotal" required>
            <!-- Mensajes de validación -->
          </div>
          <div class="form-group">
            <label for="precio">Precio:</label>
            <input type="text" class="form-control" id="precio" formControlName="precio" required>
            <!-- Mensajes de validación -->
          </div>
          <div class="form-group">
            <label for="idCategoria">ID Categoría:</label>
            <input type="text" class="form-control" id="idCategoria" formControlName="idCategoria" required>
            <!-- Mensajes de validación -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-cancelar" routerLink="/dashboard-productos">Cancelar</button>
            <button type="submit" class="btn-primary">Guardar</button>
          </div>
          <div *ngIf="formularioProducto.invalid && enviado">
            <p>Por favor, complete todos los campos correctamente antes de guardar.</p>
          </div>
        </form>
      </div>
    </div>
  </div>
