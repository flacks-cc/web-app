<div class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h5 class="modal-title">{{ titulo }}</h5>
    </div>
    <div class="modal-body">
      <form [formGroup]="formProducto" (ngSubmit)="agregarOEditar()" autocomplete="off">
        <!-- Campos del formulario -->
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" class="form-control" id="nombre" formControlName="nombre" required>
          <!-- Mensajes de validación -->
        </div>
        <div class="form-group">
          <label for="descripcion">* Descripción:</label>
          <textarea class="form-control no-resize" id="descripcion" formControlName="descripcion" required></textarea>
        </div>
        <!-- form-row y form-col es para que se muestren los campos en una misma linea -->
        <div class="form-row">
          <div class="form-col">
              <div class="form-group">
                  <label for="precio">* Precio:</label>
                  <input type="number" class="form-control" id="precio" min="0" formControlName="precio" required>
                  <p>Ingresa el precio a tu producto</p>
              </div>
          </div>
          <div class="form-col">
              <div class="form-group">
                  <label for="stock">* Stock:</label>
                  <input type="number" class="form-control" id="stock" min="0" formControlName="stock" required>
                  <p>Ingresa la cantidad disponible de tu producto</p>
              </div>
          </div>
      </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancelar" routerLink="/dashboard-productos">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
        <div *ngIf="formProducto.invalid && submitted">
          <p>Por favor, complete todos los campos correctamente antes de guardar.</p>
        </div>
      </form>
    </div>
  </div>
</div>
