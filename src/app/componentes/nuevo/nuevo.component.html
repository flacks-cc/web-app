<div id="main-container">
    <section id="signup" class="signup-section">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h5 class="modal-title">Registro de nuevo usuario</h5>
                </div>
                <div class="modal-body">
                    <form id="signup-form" [formGroup]="formularioUsuario" (ngSubmit)="registrarNuevoUsuario()" autocomplete="off">
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" class="form-control" formControlName="nombre" placeholder="Nombre">
                        </div>
                        <div class="form-group">
                            <label for="apellidoPaterno">Apellido Paterno:</label>
                            <input type="text" id="apellidoPaterno" class="form-control" formControlName="apellidoPaterno" placeholder="Apellido Paterno">
                        </div>
                        <div class="form-group">
                            <label for="apellidoMaterno">Apellido Materno:</label>
                            <input type="text" id="apellidoMaterno" class="form-control" formControlName="apellidoMaterno" placeholder="Apellido Materno">
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono:</label>
                            <input type="tel" id="telefono" class="form-control" formControlName="telefono" placeholder="Teléfono" pattern="[0-9]+" title="Ingrese solo números">
                          </div>                                                
                        <div class="form-group">
                            <label for="nombreUsuario">Nombre de Usuario:</label>
                            <input type="text" id="nombreUsuario" class="form-control" formControlName="nombreUsuario" placeholder="Nombre de Usuario">
                        </div>
                        <div class="form-group">
                            <label for="email">Correo electrónico:</label>
                            <input type="email" id="email" class="form-control" formControlName="email" placeholder="Correo electrónico">
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña:</label>
                            <input type="password" id="password" class="form-control" formControlName="password" placeholder="Contraseña">
                        </div>
                        <button type="submit" [disabled]="formularioUsuario.invalid" class="btn-primary">Registrar</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
